---
- name: Initial server setup
  hosts: all
  become: true

  tasks:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install common packages
      apt:
        name:
          - curl
          - wget
          - git
          - unzip
          - ufw
          - fail2ban
          - htop
          - iptables-persistent
        state: present

    - name: Allow SSH through UFW
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP through UFW
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS through UFW
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Set UFW default incoming policy to deny
      ufw:
        direction: incoming
        policy: deny

    - name: Set UFW default outgoing policy to allow
      ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Open HTTP in OCI iptables
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "80"
        jump: ACCEPT

    - name: Open HTTPS in OCI iptables
      iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "443"
        jump: ACCEPT

    - name: Persist iptables rules
      shell: netfilter-persistent save
      changed_when: false